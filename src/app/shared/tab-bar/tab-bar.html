<nav class="tab-bar" aria-label="App navigation">
  @for (tab of tabs; track tab.path) {
    @if (tab.path === '/') {
      <a
        class="tab-bar__item"
        [class.tab-bar__item--primary]="tab.primary"
        routerLink="/"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="goPlay($event)"
      >
        <span class="tab-bar__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 21V4" />
            <path d="M5 4h12l-3.5 4L17 12H5" />
          </svg>
        </span>
        <span class="tab-bar__label">{{ tab.label }}</span>
      </a>
    } @else {
      <a
        class="tab-bar__item"
        [class.tab-bar__item--primary]="tab.primary"
        [routerLink]="tab.path"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: tab.path === '/' }"
      >
        <span class="tab-bar__icon" aria-hidden="true">
          @switch (tab.icon) {
            @case ('history') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M4 6h16M4 12h16M4 18h10" />
              </svg>
            }
            @case ('friends') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <circle cx="9" cy="8" r="3" />
                <circle cx="17" cy="9" r="2.5" />
                <path d="M3 20c0-3 2.7-5 6-5s6 2 6 5" />
                <path d="M14 20c0-2 1.5-3.5 3.5-3.5" />
              </svg>
            }
            @case ('profile') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <circle cx="12" cy="8" r="3.5" />
                <path d="M5 20c0-3.5 3.1-6 7-6s7 2.5 7 6" />
              </svg>
            }
          }
        </span>
        <span class="tab-bar__label">{{ tab.label }}</span>
      </a>
    }
  }
</nav>
